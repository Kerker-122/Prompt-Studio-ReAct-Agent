cases:
- id: B001
  name: 人物固定锚点
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 连续镜头中的人物固定锚点通常包括什么？
  expected_output: 应包含稳定的脸型、发型发色、体型、固定服装、核心配色和标志性道具，并在各镜头重复使用。
- id: B002
  name: 人物可变信息
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 人物提示词中哪些信息可以随镜头变化？
  expected_output: 表情、姿态、动作、视线、位置和临时状态可以变化，但固定外貌、服装和标志物应保持一致。
- id: B003
  name: 多人物防串位
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 多人同框时怎样避免人物特征串位？
  expected_output: 应分别描述每个人物的外貌、服装、位置、动作和道具，并保持称谓与空间关系一致。
- id: B004
  name: 分镜必要字段
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 可执行分镜脚本需要哪些基本字段？
  expected_output: 应包含镜号、时长、景别、机位、画面、人物动作、运镜、声音或对白和转场，并检查连续性。
- id: B005
  name: 景别选择原则
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 全景、中景和特写分别适合表现什么？
  expected_output: 全景交代环境与关系，中景表现人物动作与互动，特写强调表情、细节或关键道具。
- id: B006
  name: 推镜头作用
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 推镜头通常用于表达什么？
  expected_output: 推镜头通过接近主体强化注意、情绪或信息揭示，提示词应写清起点、速度、主体和落点。
- id: B007
  name: 拉镜头作用
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 拉镜头适合怎样的叙事目的？
  expected_output: 拉镜头可从局部退到整体，用于揭示环境、人物处境或关系变化，并应说明结束画面。
- id: B008
  name: 环绕运镜要素
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 环绕持剑人物的运镜提示词要写哪些要素？
  expected_output: 应写明环绕起点、方向、路径、速度、持续时间、主体位置、叙事目的和最终落点。
- id: B009
  name: 短镜头运镜控制
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 为什么短镜头不宜堆叠太多运镜？
  expected_output: 多个主运镜会造成运动冲突和画面不稳定；短镜头应围绕一个主要运镜并明确目的。
- id: B010
  name: 空间轴线连续
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 分镜中的空间轴线为什么重要？
  expected_output: 应保持人物位置、视线和运动方向的空间关系，避免越轴造成方向突变和观众理解混乱。
- id: B011
  name: 统一光影规则
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 多镜头怎样保持光影统一？
  expected_output: 应固定主光方向、色温、时间与环境光逻辑，只有剧情明确变化时才调整并说明原因。
- id: B012
  name: 主风格控制
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 提示词怎样避免视觉风格冲突？
  expected_output: 选择一个主风格，补充一致的色彩、材质和光线描述，删除互斥或重复的风格词。
- id: B013
  name: 构图信息
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 画面构图提示通常需要说明什么？
  expected_output: 应说明主体位置、景别、视角、前中后景关系、视觉重心和必要留白，使画面结果可观察。
- id: B014
  name: 道具连续性
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 连续分镜怎样保证关键道具不突然变化？
  expected_output: 为道具建立固定外观和状态锚点，逐镜记录持有者、位置、左右手及状态变化原因。
- id: B015
  name: 短剧开场钩子
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 30秒短剧前3秒怎样设计钩子？
  expected_output: 应直接呈现异常、冲突、危险或悬念，通过具体动作和画面吸引观众，避免长篇背景介绍。
- id: B016
  name: 短剧尾钩
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 短剧结尾怎样留下尾钩？
  expected_output: 可以保留未完成动作、新危险、身份线索或反转后果，形成下一步必须解决的新问题。
- id: B017
  name: 短剧对白原则
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: AI短剧对白应该遵循哪些原则？
  expected_output: 对白应推进事件、揭示关系或暴露人物，保持简短可说，避免重复画面和大段解释。
- id: B018
  name: 十五秒时间轴
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 15秒视频时间轴应怎样划分？
  expected_output: 时间段应连续、不重叠且总和为15秒，每段只承担一个主要动作或信息变化，并保持镜头衔接。
- id: B019
  name: 提示词排除项
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 生成提示词中的排除项有什么作用？
  expected_output: 排除项用于约束人物漂移、肢体错误、随机文字、服装跳变和画面杂乱等不希望出现的问题。
- id: B020
  name: 提示词质量维度
  difficulty: basic
  scenario: knowledge_retrieval
  evaluation_profile: rag_quality
  input: 检查AI视频提示词质量时应关注哪些维度？
  expected_output: 应检查意图保真、主体、动作、场景、镜头、视觉统一、连续性、时长、表达效率和平台适配。
- id: B021
  name: 雨夜女剑客补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 把“雨夜里的女剑客”补全成可执行画面提示词。
  expected_output: 应补全女剑客固定外貌与服装、雨夜场景、具体动作、景别机位、光源色调、风格和连续性排除项。
- id: B022
  name: 雪山孤狼补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 把“雪山上的孤狼”扩写成电影感提示词。
  expected_output: 应明确孤狼外观和动作、雪山天气与地形、镜头景别、冷色光影、风雪动态和画面质感。
- id: B023
  name: 赛博侦探补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 补全提示词：赛博城市里的女侦探。
  expected_output: 应补充人物辨识锚点、城市空间、侦查动作、霓虹主色、构图视角、镜头语言和统一风格。
- id: B024
  name: 古寺烛火补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 补全“老僧在古寺点燃最后一盏灯”。
  expected_output: 应明确老僧外貌服装、古寺环境、点灯动作、烛光方向、景别机位、氛围和结束画面。
- id: B025
  name: 废土少女补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 把“废土少女寻找水源”写成完整视频提示词。
  expected_output: 应固定少女服装与道具，描述废土环境、寻找动作、镜头推进、光影色调、危机线索和连续性。
- id: B026
  name: 海底遗迹补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 完善“潜水员发现海底遗迹”的画面提示词。
  expected_output: 应补充潜水员外观装备、遗迹尺度、发现动作、镜头路径、水下光线、悬浮颗粒和结束落点。
- id: B027
  name: 猫咪咖啡店补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 把“橘猫经营深夜咖啡店”扩写成温暖风格提示词。
  expected_output: 应明确橘猫形象、店内陈设、可见动作、暖色主光、构图景别、材质和统一治愈风格。
- id: B028
  name: 机甲启动补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 补全“废弃机甲重新启动”。
  expected_output: 应写清机甲固定结构、废墟环境、启动过程、能量变化、镜头运动、冷暖光对比和动作结果。
- id: B029
  name: 校园重逢补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 扩写“多年后两人在校园重逢”。
  expected_output: 应补充人物辨识特征、校园时空、相遇动作与表情、景别切换、光影氛围和人物关系线索。
- id: B030
  name: 纸鹤飞行补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 优化“纸鹤飞过城市”的视频提示词。
  expected_output: 应说明纸鹤材质、起点与路径、城市环境、相机跟随方式、光线、速度和最终落点。
- id: B031
  name: 镜中另一个我补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 补全“女孩发现镜中的自己没有同步动作”。
  expected_output: 应固定女孩与镜像外观，写清不同步动作、镜头与构图、光影、异常出现顺序和悬念结尾。
- id: B032
  name: 雨巷追逐补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 完善“雨巷里的追逐”提示词。
  expected_output: 应明确追逐双方、位置与方向、雨巷环境、主动作、跟拍方式、光影色调和空间连续性。
- id: B033
  name: 沙漠列车补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 扩写“列车穿过沙漠风暴”。
  expected_output: 应写清列车外观、风暴强度、运动方向、远近景关系、镜头方式、色调和可观察结果。
- id: B034
  name: 厨房魔法补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 补全“厨师用魔法做一道菜”。
  expected_output: 应明确厨师形象、厨房空间、施法和烹饪动作、食材变化、镜头景别、光效与风格。
- id: B035
  name: 月球花朵补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 把“月球上开出第一朵花”改成完整提示词。
  expected_output: 应补充花朵与宇航员锚点、月面场景、生长动作、镜头推进、光线色调、尺度感和情绪结果。
- id: B036
  name: 旧照片复活补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 扩写“旧照片里的人开始移动”。
  expected_output: 应说明照片材质、人物特征、动作变化顺序、现实环境、镜头聚焦、光影和诡异氛围。
- id: B037
  name: 云端鲸鱼补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 优化“鲸鱼在云层中游动”。
  expected_output: 应补充鲸鱼外观尺度、云层环境、游动路径、相机运动、日光色彩、空间层次和梦幻主风格。
- id: B038
  name: 竹林对决补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 完善“两个剑客在竹林对决”。
  expected_output: 应分别固定两名剑客特征，明确站位、动作方向、竹林环境、主运镜、光影和避免串位的约束。
- id: B039
  name: 机器人浇花补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 扩写“生锈机器人每天给花浇水”。
  expected_output: 应补充机器人固定外观、花与场景、浇水动作、镜头、光影、材质对比和情感氛围。
- id: B040
  name: 城市时间停止补全
  difficulty: basic
  scenario: prompt_completion
  evaluation_profile: rag_quality
  input: 补全“城市突然时间停止，只有男主能动”。
  expected_output: 应建立男主锚点，描述静止人群和环境、男主可见动作、镜头变化、统一光影及异常线索。
- id: M041
  name: 竖屏雨夜追凶
  difficulty: medium
  scenario: multi_condition
  evaluation_profile: rag_quality
  input: 为雨夜追凶设计15秒9:16视频：女侦探稳定、冷蓝色、节奏紧凑、结尾出现红伞线索。
  expected_output: 应固定女侦探锚点，按连续15秒时间轴组织追凶动作，统一冷蓝雨夜与竖屏构图，结尾以红伞形成明确线索。
- id: M042
  name: 暖色无对白重逢
  difficulty: medium
  scenario: multi_condition
  evaluation_profile: rag_quality
  input: 设计20秒无对白重逢片段，暖色写实风格，只用三个镜头，并保持旧怀表连续。
  expected_output: 应以三个连续镜头完成重逢，用动作和表情叙事，统一暖色写实风格，并固定怀表外观、持有者和状态。
- id: M043
  name: Seedance单主运镜
  difficulty: medium
  scenario: multi_condition
  evaluation_profile: rag_quality
  input: 做一个12秒Seedance片段：少年御剑穿云，只用一种主运镜，强调速度且人物不能漂移。
  expected_output: 应固定少年人物锚点，建立连续12秒时间轴，选择一种以速度表达为目的的主运镜，并约束外貌服装不变。
- id: M044
  name: 四镜头产品叙事
  difficulty: medium
  scenario: multi_condition
  evaluation_profile: rag_quality
  input: 用四个镜头表现机械手表从损坏到修复，黑金风格、无人物、总时长16秒。
  expected_output: 应按四个连续镜头展示损坏、拆解、修复和运行结果，统一黑金材质与光线，总时长16秒且不出现人物。
- id: M045
  name: 双人物位置约束
  difficulty: medium
  scenario: multi_condition
  evaluation_profile: rag_quality
  input: 生成15秒双人争执分镜：姐姐始终在左、弟弟在右，不越轴，最后弟弟离开画面。
  expected_output: 应区分两人外观与称谓，保持左右位置和轴线，安排争执动作及弟弟离场方向，时间段总和为15秒。
- id: M046
  name: 一镜到底古城
  difficulty: medium
  scenario: multi_condition
  evaluation_profile: rag_quality
  input: 设计10秒一镜到底：信使穿过古城集市交出密信，写实、黄昏、镜头不能切换。
  expected_output: 应在一个连续镜头中写清信使锚点、穿行路径、跟随运镜、集市环境、黄昏光线和交信落点，不得切镜。
- id: M047
  name: 恐怖但无血腥
  difficulty: medium
  scenario: multi_condition
  evaluation_profile: rag_quality
  input: 写15秒恐怖短片：废弃医院、无血腥画面、只靠声音和光影制造紧张，结尾留悬念。
  expected_output: 应利用空间、灯光变化、声音和未完全揭示的异常制造恐怖，避免血腥内容，并以悬念画面收尾。
- id: M048
  name: 儿童向太空救援
  difficulty: medium
  scenario: multi_condition
  evaluation_profile: rag_quality
  input: 设计儿童向太空救援分镜，色彩明亮、无危险细节、机器人形象稳定、总长20秒。
  expected_output: 应固定友好机器人外观，以明亮统一视觉和安全可理解的动作完成救援，时间连续且避免惊吓性危险描写。
- id: M049
  name: 水墨横屏运镜
  difficulty: medium
  scenario: multi_condition
  evaluation_profile: rag_quality
  input: 为水墨山河主题设计12秒16:9视频，包含由远到近的空间变化，但不要写实摄影质感。
  expected_output: 应保持水墨主风格与横屏构图，通过明确运镜实现由远景到近景的空间变化，避免写实材质和冲突风格。
- id: M050
  name: 固定机位情绪变化
  difficulty: medium
  scenario: multi_condition
  evaluation_profile: rag_quality
  input: 用固定机位表现女孩从期待到失望，8秒、室内雨天、不能使用对白。
  expected_output: 应保持机位不动，通过表情、动作、道具或窗外雨景变化完成情绪转折，总时长8秒且不使用对白。
- id: M051
  name: 角色卡到分镜
  difficulty: medium
  scenario: multi_knowledge
  evaluation_profile: rag_quality
  input: 如何把角色卡、剧情钩子和运镜规则组合成15秒短剧分镜？
  expected_output: 应先固定角色锚点，再以钩子、冲突和尾钩组织时间轴，为各镜头配置有叙事目的的景别运镜并检查连续性。
- id: M052
  name: 视觉规范与连续性
  difficulty: medium
  scenario: multi_knowledge
  evaluation_profile: rag_quality
  input: 多镜头作品怎样同时统一人物、道具、色调和主光？
  expected_output: 应分别建立人物卡、道具状态和视觉规范，逐镜复用固定信息，只对有剧情依据的变量进行明确修改。
- id: M053
  name: 主题转完整方案
  difficulty: medium
  scenario: multi_knowledge
  evaluation_profile: rag_quality
  input: 只有“记忆可以交易”这个主题，怎样形成角色、冲突、视觉和分镜方案？
  expected_output: 应补全角色欲望与代价、紧迫冲突和尾钩，建立人物及道具锚点、统一视觉规范，并转成连续时间轴分镜。
- id: M054
  name: 平台适配与通用规则
  difficulty: medium
  scenario: multi_knowledge
  evaluation_profile: rag_quality
