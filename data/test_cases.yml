cases:
  - name: 多镜头人物一致性
    category: 人物设计与连续性
    difficulty: simple
    input: >
      我准备生成一组连续镜头，怎样写提示词才能让同一个人物在不同镜头中保持一致？
    expected_output: >
      先为人物建立固定角色卡，明确发型、脸部特征、服装、体型和标志性道具等不可随意变化的视觉锚点；
      在每个镜头中重复这些关键锚点，只改变当前动作、表情、位置和景别等可变信息。
      多人物场景还应分别描述每个人物，避免特征串位，并在生成后检查服装、道具和外观是否连续。

  - name: 十五秒视频时间轴
    category: 视频提示词与时间轴
    difficulty: simple
    input: >
      15秒的Seedance视频提示词应该怎样划分时间轴？
    expected_output: >
      应先写整体设定，再按连续且不重叠的时间段描述画面，例如0至3秒、3至7秒、7至11秒和11至15秒。
      各时间段总时长必须等于15秒，每段只安排一个主要动作或一个清晰变化，并说明主体动作、镜头运动和画面结果。
      相邻分段要保持人物、场景、道具和运动方向连续。

  - name: 环绕运镜写法
    category: 运镜设计
    difficulty: simple
    input: >
      我想让镜头环绕持剑人物一周，提示词应该写清楚哪些内容？
    expected_output: >
      需要写明运镜起点、环绕路径与方向、速度、持续时间、主体在画面中的位置以及结束画面。
      环绕的目的也要明确，例如展示人物全貌、揭示环境或强化压迫感。
      短镜头应以一种主运镜为核心，避免同时堆叠多个互相冲突的镜头动作。

  - name: 统一画面风格
    category: 美术与视觉设计
    difficulty: simple
    input: >
      为什么提示词里堆很多风格词反而效果不好，应该怎么改？
    expected_output: >
      大量互相冲突的风格词会让模型无法确定统一的视觉方向，容易造成材质、色彩和光影混乱。
      应选择一个主风格，再补充少量与其一致的色彩、光线、材质和构图描述，并删除含义重复或相互矛盾的词。
      多镜头作品还应建立统一的视觉规范，使角色、场景、色调和光源保持连续。

  - name: 分镜脚本必要字段
    category: 分镜设计
    difficulty: simple
    input: >
      一份可以直接执行的分镜脚本通常要包含哪些字段？
    expected_output: >
      每个镜头应至少包含镜头编号、时长、景别、机位或角度、主体动作、场景信息、运镜方式、声音或对白以及转场方式。
      还要检查镜头之间的空间轴线、人物位置、动作方向和道具状态是否连续，确保总时长符合目标片长。

  - name: 空泛提示词诊断
    category: 提示词质量检查
    difficulty: simple
    input: >
      “一个很有电影感、非常震撼、特别唯美的画面”这段提示词有什么问题？
    expected_output: >
      这段描述只有抽象评价，没有明确主体、动作、场景、构图、镜头、光影和风格锚点，生成结果因此难以控制和验证。
      优化时应补充谁在什么环境中做什么、采用什么景别与视角、光源和色调如何、希望形成什么可观察的画面结果，
      同时删除无法直接转化为视觉元素的空泛形容词。

  - name: 短剧开场钩子
    category: 短剧创作
    difficulty: simple
    input: >
      30秒短剧的前3秒应该怎样设计，才能快速吸引观众？
    expected_output: >
      前3秒应直接呈现异常事件、强烈冲突、迫近危机或关键悬念，让观众立即知道人物面临的问题。
      钩子需要通过可见动作和具体画面表达，避免用大段背景介绍拖慢节奏；随后快速建立人物目标和阻碍，
      并在结尾保留反转、未完成动作或新问题作为尾钩。

  - name: 即梦提示词结构
    category: 提示词优化
    difficulty: simple
    input: >
      我只有“雨夜里的女剑客”这个主题，怎样扩写成适合即梦生成的提示词？
    expected_output: >
      可以按照生成目标、主体锚点、场景、动作、构图与镜头、光影色彩、风格质感、质量要求和排除项的顺序扩写。
      例如先固定女剑客的外貌与服装，再描述雨夜场景和可观察动作，补充景别、机位、主光方向、色调和统一风格，
      最后加入需要避免的畸形、人物漂移或画面杂乱等问题；具体字段应根据图像或视频任务取舍。

  - name: 综合创作方案设计
    category: 跨知识点综合应用
    difficulty: hard
    input: >
      请把“失忆剑客在雨夜发现断剑隐藏着自己的身份真相”设计成15秒AI短剧片段，要求人物稳定、节奏紧凑、运镜明确、光影统一，并在结尾留下悬念。设计时要遵循哪些原则？
    expected_output: >
      先建立剑客的固定角色锚点和断剑道具锚点，再把15秒拆成连续、不重叠且总时长准确的时间段。
      开场迅速用雨夜异常或断剑异动形成钩子，中段通过一个主要动作推进发现过程，并为每段写清景别、机位、主运镜、动作结果和衔接关系。
      画面应统一雨夜冷色环境与明确主光，保持人物外观、断剑状态、运动方向和空间轴线连续；结尾用身份线索显现但未完全揭晓的画面形成尾钩。

  - name: 知识库边界处理
    category: 边界与事实性
    difficulty: hard
    input: >
      请告诉我Seedance当前最新会员价格、API每分钟限流数以及商用授权的完整法律条款。
    expected_output: >
      当前知识库没有这些会随平台政策变化的实时价格、API限流和法律授权信息，因此不能给出未经验证的具体数字或条款。
      应明确说明信息边界，并建议用户查询Seedance官方定价页面、最新API文档和服务协议；涉及商用授权时还应以最新官方合同或专业法律意见为准。
