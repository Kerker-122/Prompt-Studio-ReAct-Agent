<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360" preserveAspectRatio="xMidYMid meet" fill="#172033" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">镜语 Prompt Studio 技术架构</title>
  <desc id="diagram-desc">展示 Streamlit 交互层、LangGraph ReAct Agent 的 Thought、Action、Observation 闭环，Agent 工具、RAG 总结服务、通义千问模型，以及本地知识文档进入 ChromaDB 的离线入库流程。</desc>

  <defs>
    <style>
      text {
        font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      }
      .title { font-size: 38px; font-weight: 700; text-anchor: middle; }
      .subtitle { font-size: 18px; fill: #64748b; text-anchor: middle; }
      .lane-label { font-size: 16px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .card-title { font-size: 23px; font-weight: 700; text-anchor: middle; }
      .card-text { font-size: 18px; text-anchor: middle; }
      .card-note { font-size: 16px; fill: #64748b; text-anchor: middle; }
      .loop-title { font-size: 22px; font-weight: 700; text-anchor: middle; }
      .loop-text { font-size: 17px; fill: #5b6475; text-anchor: middle; }
      .chip-text { font-size: 15px; font-weight: 600; text-anchor: middle; }
      .edge-label { font-size: 16px; font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; stroke-linejoin: round; }
      .edge-request { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-request); }
      .edge-return { fill: none; stroke: #059669; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-return); }
      .edge-loop { fill: none; stroke: #7c3aed; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-loop); }
      .edge-index { fill: none; stroke: #d97706; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow-index); }
      .edge-dependency { fill: none; stroke: #64748b; stroke-width: 2.2; stroke-dasharray: 8 7; stroke-linecap: round; marker-end: url(#arrow-dependency); }
    </style>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <marker id="arrow-request" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-index" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-dependency" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="1360" fill="#f8fafc"/>
  <path d="M0 0 H1600 V8 H0 Z" fill="#7c3aed"/>

  <text class="title" x="800" y="58">镜语 Prompt Studio · 技术架构</text>
  <text class="subtitle" x="800" y="88">LangChain / LangGraph ReAct Agent · RAG 知识增强 · Streamlit 流式交互</text>

  <!-- Interaction layer -->
  <text class="lane-label" x="60" y="127">INTERACTION · 交互层</text>
  <rect x="470" y="112" width="660" height="122" rx="14" fill="#eef6ff" stroke="#2563eb" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="470" y="112" width="10" height="122" rx="5" fill="#2563eb"/>
  <text class="card-title" x="800" y="153">用户 · Streamlit 交互层</text>
  <text class="card-text" x="800" y="183">创作输入 · 平台与模式选择 · 多轮会话 · 流式展示</text>
  <text class="card-note" x="800" y="211">app.py</text>

  <!-- Agent core -->
  <rect x="120" y="270" width="1360" height="500" rx="18" fill="#f8f6ff" stroke="#7c3aed" stroke-width="3" filter="url(#shadow)"/>
  <rect x="120" y="270" width="12" height="500" rx="6" fill="#7c3aed"/>

  <!-- Request and streamed response are separate arrows, drawn above the card border. -->
  <path class="edge-request" d="M742 234 V270" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-request)"/>
  <text class="edge-label" x="650" y="257" fill="#2563eb">消息 + thread_id</text>
  <path class="edge-return" d="M858 270 V234" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-return)"/>
  <text class="edge-label" x="920" y="257" fill="#059669">流式回答</text>

  <text class="lane-label" x="168" y="303" style="fill:#7c3aed">LANGGRAPH ORCHESTRATION</text>
  <text class="card-title" x="800" y="322">LangGraph ReAct Agent</text>
  <text class="card-note" x="800" y="349">agent/react_agent.py · create_agent</text>

  <rect x="260" y="390" width="280" height="120" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.3"/>
  <circle cx="300" cy="430" r="17" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="300" y="436" font-size="18" font-weight="700" text-anchor="middle" fill="#6d28d9">1</text>
  <text class="loop-title" x="400" y="434">Thought</text>
  <text class="loop-text" x="400" y="469">理解需求 · 规划下一步</text>

  <rect x="1000" y="390" width="320" height="120" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.3"/>
  <circle cx="1040" cy="430" r="17" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1040" y="436" font-size="18" font-weight="700" text-anchor="middle" fill="#6d28d9">2</text>
  <text class="loop-title" x="1160" y="434">Action</text>
  <text class="loop-text" x="1160" y="469">生成 tool_calls · 调用工具</text>

  <rect x="640" y="545" width="320" height="100" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.3"/>
  <circle cx="680" cy="580" r="17" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="680" y="586" font-size="18" font-weight="700" text-anchor="middle" fill="#6d28d9">3</text>
  <text class="loop-title" x="800" y="584">Observation</text>
  <text class="loop-text" x="800" y="616">ToolMessage · 状态更新</text>

  <!-- ReAct loop: Thought -> Action -> Observation -> Thought. -->
  <path class="edge-loop" d="M540 450 H1000" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-loop)"/>
  <text class="edge-label" x="770" y="437" fill="#7c3aed">推理与决策</text>
  <path class="edge-loop" d="M1160 510 V595 H960" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-loop)"/>
  <text class="edge-label" x="1080" y="582" fill="#7c3aed">执行结果</text>
  <path class="edge-loop" d="M640 595 H400 V510" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-loop)"/>
  <text class="edge-label" x="520" y="582" fill="#7c3aed">反馈</text>

  <!-- Middleware and state live inside create_agent, not downstream from it. -->
  <rect x="180" y="678" width="1240" height="62" rx="12" fill="#f1edff" stroke="#c4b5fd" stroke-width="1.7"/>
  <text x="272" y="716" font-size="16" font-weight="700" text-anchor="middle" fill="#6d28d9">Middleware &amp; State</text>
  <rect x="380" y="692" width="205" height="36" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="chip-text" x="482" y="716">工具调用监控</text>
  <rect x="605" y="692" width="205" height="36" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="chip-text" x="708" y="716">模型调用日志</text>
  <rect x="830" y="692" width="255" height="36" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="chip-text" x="958" y="716">动态 Prompt（main / report）</text>
  <rect x="1105" y="692" width="275" height="36" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="chip-text" x="1242" y="716">InMemorySaver · thread_id</text>

  <!-- Runtime service layer -->
  <text class="lane-label" x="60" y="818">ONLINE · 运行时调用链</text>

  <rect x="60" y="850" width="430" height="180" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.4" filter="url(#shadow)"/>
  <rect x="60" y="850" width="9" height="180" rx="4" fill="#ea580c"/>
  <text class="card-title" x="275" y="894">Agent 工具层</text>
  <text class="card-text" x="275" y="927">知识查询 · 提示词优化 · 分镜生成</text>
  <text class="card-text" x="275" y="955">质量诊断 · 能力查询 · 完整方案切换</text>
  <text class="card-note" x="275" y="987">4 个 RAG 工具 · 2 个本地工具</text>
  <text class="card-note" x="275" y="1011">agent/tools/agent_tools.py</text>

  <rect x="585" y="850" width="430" height="180" rx="14" fill="#effcf7" stroke="#059669" stroke-width="2.4" filter="url(#shadow)"/>
  <rect x="585" y="850" width="9" height="180" rx="4" fill="#059669"/>
  <text class="card-title" x="800" y="894">RAG 总结服务</text>
  <text class="card-text" x="800" y="927">Retriever → PromptTemplate → LLM</text>
  <text class="card-text" x="800" y="955">语义检索 · 上下文组装 · 结果总结</text>
  <text class="card-note" x="800" y="987">Chroma Top-K = 3</text>
  <text class="card-note" x="800" y="1011">rag/rag_service.py</text>

  <rect x="1110" y="850" width="430" height="180" rx="14" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.4" filter="url(#shadow)"/>
  <rect x="1110" y="850" width="9" height="180" rx="4" fill="#4f46e5"/>
  <text class="card-title" x="1325" y="894">通义千问 Chat 模型</text>
  <text class="card-text" x="1325" y="927">ChatTongyi · qwen-plus</text>
  <text class="card-text" x="1325" y="955">Agent 推理 + RAG 总结</text>
  <text class="card-note" x="1325" y="987">阿里云百炼</text>
  <text class="card-note" x="1325" y="1011">model/factory.py</text>

  <!-- Agent/tool and Agent/model use separate request and return arrows. -->
  <path class="edge-request" d="M270 770 V850" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-request)"/>
  <text class="edge-label" x="320" y="814" fill="#2563eb">调用工具</text>
  <path class="edge-return" d="M372 850 V770" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-return)"/>
  <text class="edge-label" x="430" y="814" fill="#059669">ToolMessage</text>

  <path class="edge-request" d="M1274 770 V850" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-request)"/>
  <text class="edge-label" x="1225" y="814" fill="#2563eb">模型请求</text>
  <path class="edge-return" d="M1376 850 V770" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-return)"/>
  <text class="edge-label" x="1434" y="814" fill="#059669">模型输出</text>

  <!-- Tool -> RAG -> model, with independent return paths. -->
  <path class="edge-request" d="M490 900 H585" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-request)"/>
  <text class="edge-label" x="538" y="888" fill="#2563eb">4 个 RAG 工具</text>
  <path class="edge-return" d="M585 972 H490" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-return)"/>
  <text class="edge-label" x="538" y="996" fill="#059669">总结结果</text>

  <path class="edge-request" d="M1015 900 H1110" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-request)"/>
  <text class="edge-label" x="1062" y="888" fill="#2563eb">总结请求</text>
  <path class="edge-return" d="M1110 972 H1015" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-return)"/>
  <text class="edge-label" x="1062" y="996" fill="#059669">模型结果</text>

  <!-- Knowledge ingestion layer -->
  <text class="lane-label" x="60" y="1101">OFFLINE · 知识库入库</text>

  <rect x="50" y="1140" width="300" height="130" rx="13" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
  <text class="card-title" x="200" y="1182">本地知识文档</text>
  <text class="card-text" x="200" y="1215">data/*.txt · *.pdf</text>
  <text class="card-note" x="200" y="1245">MD5 增量去重</text>

  <rect x="410" y="1140" width="300" height="130" rx="13" fill="#fffbeb" stroke="#d97706" stroke-width="2.2"/>
  <text class="card-title" x="560" y="1182">文档处理</text>
  <text class="card-text" x="560" y="1215">TXT / PyPDF Loader</text>
  <text class="card-note" x="560" y="1245">RecursiveCharacterTextSplitter</text>

  <rect x="770" y="1140" width="360" height="130" rx="13" fill="#fff7ed" stroke="#d97706" stroke-width="2.2"/>
  <text class="card-title" x="950" y="1182">DashScope Embedding</text>
  <text class="card-text" x="950" y="1215">qwen3.7-text-embedding-flash</text>
  <text class="card-note" x="950" y="1245">model/factory.py · 阿里云百炼</text>

  <rect x="1200" y="1140" width="350" height="130" rx="13" fill="#ecfdf5" stroke="#059669" stroke-width="2.2"/>
  <text class="card-title" x="1375" y="1182">ChromaDB</text>
  <text class="card-text" x="1375" y="1215">prompt_optimizer_v1</text>
  <text class="card-note" x="1375" y="1245">chroma_db · Top-K = 3</text>

  <!-- Offline indexing is a one-way pipeline. -->
  <path class="edge-index" d="M350 1205 H410" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-index)"/>
  <text class="edge-label" x="380" y="1192" fill="#d97706">加载</text>
  <path class="edge-index" d="M710 1205 H770" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-index)"/>
  <text class="edge-label" x="740" y="1192" fill="#d97706">分块</text>
  <path class="edge-index" d="M1130 1205 H1200" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-index)"/>
  <text class="edge-label" x="1165" y="1192" fill="#d97706">向量写入</text>

  <!-- Online retrieval and Top-K return are kept distinct from offline indexing. -->
  <path class="edge-request" d="M900 1030 V1080 H1260 V1140" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-request)"/>
  <text class="edge-label" x="1092" y="1070" fill="#2563eb">语义检索（内部调用 Embedding）</text>
  <path class="edge-return" d="M1460 1140 V1050 H980 V1030" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-return)"/>
  <text class="edge-label" x="1220" y="1040" fill="#059669">Top-K = 3 文档片段</text>

  <!-- Legend -->
  <line x1="378" y1="1320" x2="422" y2="1320" class="edge-request" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-request)"/>
  <text x="435" y="1326" font-size="14">调用 / 请求</text>
  <line x1="602" y1="1320" x2="646" y2="1320" class="edge-return" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-return)"/>
  <text x="659" y="1326" font-size="14">返回 / 结果</text>
  <line x1="826" y1="1320" x2="870" y2="1320" class="edge-loop" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-loop)"/>
  <text x="883" y="1326" font-size="14">ReAct 内部闭环</text>
  <line x1="1080" y1="1320" x2="1124" y2="1320" class="edge-index" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-index)"/>
  <text x="1137" y="1326" font-size="14">离线入库</text>
</svg>
